server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  # Адрес сайта (без пути) должен уходить в Referer: без него OpenStreetMap
  # отказывается отдавать плитки карты (403 «Access blocked»).
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Служебный сайт с персональными данными — не для поисковиков.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Файлы сборки имеют хэш в имени — можно кэшировать надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Установочный файл приложения водителя.
  location /app/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    types { application/vnd.android.package-archive apk; }
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /index.html;
  }
}
